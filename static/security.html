<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort ändern · Klassenkampf</title><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/forms.css"></head><body><header><a href="/account">← Mein Konto</a></header><main class="account-card"><img class="account-logo" src="/lp-logo.png" alt="LP" width="160" height="160"><h1>Passwort ändern</h1><form id="securityForm"><label for="currentPassword">Aktuelles Passwort</label><input id="currentPassword" type="password" autocomplete="current-password" maxlength="256" required><label for="newPassword">Neues Passwort</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="repeatPassword">Passwort wiederholen</label><input id="repeatPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><p>Danach bitte erneut anmelden. Andere Anmeldungen werden ebenfalls beendet.</p><button id="securitySubmit" type="submit" disabled>Passwort ändern</button></form><section id="securitySuccess" hidden><p>Passwort geändert.</p><a href="/login">Erneut anmelden →</a></section><p id="securityError" role="alert" hidden></p></main><footer><a href="/status">● Netzwerkstatus</a><a hidden class="report-link" href="/report?page=%2Faccount%2Fsecurity">Fehler melden</a></footer><script src="/security.js"></script></body></html>
